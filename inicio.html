<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFA - Inicio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Paleta "Obsidian Refined" (Material 3 tokens, vía Stitch) - misma que index.html
                        "on-surface-variant": "#e2beba",
                        "inverse-surface": "#e5e2e1",
                        "on-error": "#690005",
                        "surface-container-lowest": "#0e0e0e",
                        "on-primary-fixed-variant": "#910a0e",
                        "secondary-container": "#e49102",
                        "tertiary-container": "#53a759",
                        "surface-container-low": "#1c1b1b",
                        "on-surface": "#e5e2e1",
                        "on-primary": "#690004",
                        "surface-tint": "#ffb4aa",
                        "outline-variant": "#5a413d",
                        "on-secondary": "#472a00",
                        "primary-container": "#ff5f52",
                        "surface": "#131313",
                        "error-container": "#93000a",
                        "on-primary-fixed": "#410002",
                        "secondary-fixed": "#ffddb9",
                        "primary-fixed": "#ffdad5",
                        "on-background": "#e5e2e1",
                        "on-tertiary": "#00390e",
                        "surface-container-highest": "#353534",
                        "secondary-fixed-dim": "#ffb961",
                        "background": "#131313",
                        "on-tertiary-fixed": "#002105",
                        "on-tertiary-container": "#00360d",
                        "on-error-container": "#ffdad6",
                        "tertiary": "#83da85",
                        "inverse-primary": "#b32822",
                        "primary-fixed-dim": "#ffb4aa",
                        "tertiary-fixed": "#9ff79f",
                        "outline": "#a98985",
                        "surface-dim": "#131313",
                        "on-tertiary-fixed-variant": "#005318",
                        "inverse-on-surface": "#313030",
                        "primary": "#ffb4aa",
                        "error": "#ffb4ab",
                        "on-secondary-fixed-variant": "#663e00",
                        "secondary": "#ffb961",
                        "on-secondary-container": "#533200",
                        "surface-container-high": "#2a2a2a",
                        "surface-variant": "#353534",
                        "surface-container": "#201f1f",
                        "surface-bright": "#393939",
                        "on-primary-container": "#640004",
                        "tertiary-fixed-dim": "#83da85",
                        "on-secondary-fixed": "#2b1700"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "1rem",
                        full: "9999px"
                    },
                    spacing: {
                        "section-margin": "2.5rem",
                        "stack-gap": "1.25rem",
                        "item-gap": "0.75rem",
                        "container-padding": "1.5rem",
                        "grid-gutter": "1.5rem"
                    },
                    fontFamily: {
                        "label-caps": ["Inter", "sans-serif"],
                        "body-sm": ["Inter", "sans-serif"],
                        "display-lg": ["Manrope", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "headline-md": ["Manrope", "sans-serif"],
                        "metric-xl": ["Inter", "sans-serif"]
                    },
                    fontSize: {
                        "label-caps": ["11px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "700" }],
                        "body-sm": ["13px", { lineHeight: "18px", fontWeight: "500" }],
                        "display-lg": ["28px", { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "800" }],
                        "body-md": ["14px", { lineHeight: "20px", fontWeight: "500" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "800" }],
                        "metric-xl": ["26px", { lineHeight: "34px", fontWeight: "700" }]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0e0e0e;
            color: #e5e2e1;
            -webkit-tap-highlight-color: transparent;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        #sidebar {
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body class="font-body-md text-body-md antialiased">

    <!-- =================================================== -->
    <!-- SIDEBAR (oculto por defecto, se activa con el menú) -->
    <!-- =================================================== -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 flex flex-col p-4 bg-surface-container-low border-r border-outline-variant/40 w-64 -translate-x-full">
        <div class="flex items-center gap-3 mb-8 px-2">
            <img src="./grafica/logo 1-1 NF.png" alt="Logo Bitácora IT" class="w-10 h-10 rounded-lg object-cover">
            <div>
                <h2 class="font-display-lg text-primary text-headline-md leading-tight">Sabri</h2>
                <p class="text-on-surface-variant font-body-sm text-body-sm">Productivity Lead</p>
            </div>
        </div>

        <nav class="flex-1 space-y-2">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 bg-secondary-container text-on-secondary-container rounded-lg font-bold transition-all">
                <span class="material-symbols-outlined">calendar_today</span>
                <span>Recordatorios diarios</span>
            </a>
            <span class="flex items-center gap-3 px-4 py-3 text-on-surface-variant/50 rounded-lg cursor-not-allowed" title="Próximamente">
                <span class="material-symbols-outlined">list_alt</span>
                <span>Recordatorios varios</span>
            </span>
        </nav>
    </aside>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black/60 z-40 hidden backdrop-blur-sm" onclick="toggleMenu()"></div>

    <!-- =================================================== -->
    <!-- TOP APP BAR -->
    <!-- =================================================== -->
    <header class="bg-[#0e0e0e] border-b border-outline-variant/30 flex justify-between items-center px-container-padding w-full h-16 fixed top-0 z-30">
        <div class="flex items-center gap-4">
            <button onclick="toggleMenu()" class="p-2 text-primary hover:text-primary-fixed-dim transition-colors active:scale-95">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <span class="font-display-lg text-[20px] text-primary-fixed tracking-tight">INICIO NFA</span>
        </div>
    </header>

    <!-- =================================================== -->
    <!-- MAIN CONTENT -->
    <!-- =================================================== -->
    <main class="relative min-h-screen flex flex-col items-center justify-center pt-16 px-container-padding overflow-hidden">
        <!-- Fondo ambiental sutil -->
        <div class="absolute inset-0 z-0 pointer-events-none opacity-50">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary-container blur-[160px] rounded-full"></div>
            <div class="absolute top-1/4 right-0 w-[400px] h-[400px] bg-secondary-container blur-[120px] rounded-full opacity-50"></div>
        </div>

        <!-- Hero de bienvenida -->
        <div class="relative z-10 text-center max-w-4xl">
            <div class="mb-8 flex justify-center">
                <div class="p-1 rounded-2xl bg-gradient-to-tr from-primary-container to-secondary-container">
                    <img src="./grafica/logo 1-1 NF.png" alt="Bitácora IT" class="w-32 h-32 rounded-xl object-cover">
                </div>
            </div>

            <h1 class="font-display-lg text-6xl md:text-8xl tracking-tighter text-on-surface mb-4">
                Bienvenida <span class="text-primary-container">Sabry</span>
            </h1>
            <p class="font-headline-md text-headline-md text-on-surface-variant mb-12">
                ¿Cómo estás hoy?
            </p>

            <div class="flex flex-col items-center gap-4 opacity-60">
                <span class="font-label-caps text-label-caps tracking-widest text-outline uppercase">DASHBOARD PERSONAL</span>
                <div class="flex gap-1 h-1 w-32 bg-surface-container-highest rounded-full overflow-hidden">
                    <div class="w-1/3 bg-primary-container"></div>
                    <div class="w-1/2 bg-secondary-container"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const isOpen = sidebar.classList.contains('-translate-x-full') === false;

            if (isOpen) {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
