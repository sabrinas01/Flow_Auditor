name: Deploy Ambiente Develop (gh-pages/dev)

# Despliega la rama `develop` en la subcarpeta `/dev/` de `gh-pages`
# (https://sabrinas01.github.io/Flow_Auditor/dev/inicio.html) sin tocar la
# raíz de producción (`/`).
on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy_dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sincronizar datos de Notion en los frontends
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_RECORDATORIOS_DIARIOS: ${{ secrets.NOTION_DB_RECORDATORIOS_DIARIOS }}
          NOTION_DB_RECORDATORIOS_VARIOS: ${{ secrets.NOTION_DB_RECORDATORIOS_VARIOS }}
          NOTION_DB_EVENTOS: ${{ secrets.NOTION_DB_EVENTOS }}
          NOTION_DB_INGRESOS: ${{ secrets.NOTION_DB_INGRESOS }}
          NOTION_DB_EGRESOS: ${{ secrets.NOTION_DB_EGRESOS }}
          NOTION_DB_SESIONES: ${{ secrets.NOTION_DB_SESIONES }}
          NOTION_DB_CICLO: ${{ secrets.NOTION_DB_CICLO }}
          NOTION_DB_SALUD_PENDIENTES: ${{ secrets.NOTION_DB_SALUD_PENDIENTES }}
          NOTION_DB_LIBROS: ${{ secrets.NOTION_DB_LIBROS || secrets.NOTION_DB_LIBRO }}
          NOTION_DB_SERIES: ${{ secrets.NOTION_DB_SERIES }}
          NOTION_DB_PELICULAS: ${{ secrets.NOTION_DB_PELICULAS }}
          NOTION_DB_GESTION_EMOCIONAL: ${{ secrets.NOTION_DB_GESTION_EMOCIONAL }}
          NOTION_DB_EMOCIONES: ${{ secrets.NOTION_DB_EMOCIONES }}
          NOTION_DB_RELACIONES: ${{ secrets.NOTION_DB_RELACIONES }}
          NOTION_DB_FRASES: ${{ secrets.NOTION_DB_FRASES }}
          NOTION_DB_DESARROLLO_PERSONAL: ${{ secrets.NOTION_DB_DESARROLLO_PERSONAL }}
        run: python extract_and_audit.py

      - name: Publicar en gh-pages/dev/
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          mkdir -p /tmp/dev_site
          cp inicio.html index.html recordatorios-diarios.html recordatorios-varios.html agenda-personal.html finanzas.html salud.html ocio.html gestion-emocional.html relaciones-y-limites.html desarrollo-personal.html styles.css manifest.json sw.js /tmp/dev_site/
          cp -r src grafica /tmp/dev_site/

          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -f -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

          rm -rf dev
          mkdir -p dev
          cp -r /tmp/dev_site/* dev/
          git add dev/

          if ! git diff --staged --quiet; then
            git commit -m "auto(dev): deploy ambiente develop"
            git push origin gh-pages
            echo "✅ Ambiente develop publicado en /dev/."
          else
            echo "⚠️ Sin cambios en /dev/, omitiendo commit."
          fi
