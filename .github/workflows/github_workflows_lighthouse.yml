name: Lighthouse audit

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Lighthouse CLI and static server
        run: |
          npm install -g lighthouse serve

      - name: Start local server for the static site
        run: |
          # El sitio es un único index.html en la raíz del repo (sin build ni bundler).
          serve -s . -l 5000 &
          npx wait-on http://localhost:5000
        env:
          CI: true

      - name: Run Lighthouse
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"
          mkdir -p reports
          lighthouse http://localhost:5000 --output html --output-path ./reports/lighthouse-${TIMESTAMP}.html --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --quiet || true

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: reports/*.html

      - name: Fail if below thresholds
        run: |
          lighthouse http://localhost:5000 --output json --output-path ./reports/lh-${TIMESTAMP}.json --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --quiet
          python3 - "$TIMESTAMP" <<'PY'
          import json,sys
          ts = sys.argv[1]
          j = json.load(open(f'reports/lh-{ts}.json'))
          scores = [j['categories'][c]['score']*100 for c in ('performance','accessibility','best-practices','seo')]
          perf,acc,bp,seo = scores
          print("scores:", scores)
          if perf < 70 or acc < 90:
              print("Lighthouse thresholds not met")
              sys.exit(1)
          PY
